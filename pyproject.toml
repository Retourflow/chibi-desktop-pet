[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chibi-desktop-pet"
version = "0.1.0.dev0"
description = "Live2D-style desktop pet with a code-based mesh rig"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
psd = ["psd-tools>=1.9"]                                  # read layered PSD files
tools = ["opencv-python-headless>=4.8", "scipy>=1.11"]    # tools/make_placeholder.py
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
